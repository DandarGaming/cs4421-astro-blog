name: Deploy site

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - name: Read deployment target
        shell: bash
        run: |
          SITE_BUCKET="$(aws cloudformation describe-stacks \
            --stack-name StaticSiteStack \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue | [0]" \
            --output text)"
          DISTRIBUTION_ID="$(aws cloudformation describe-stacks \
            --stack-name StaticSiteStack \
            --query "Stacks[0].Outputs[?OutputKey=='SiteDistributionId'].OutputValue | [0]" \
            --output text)"

          if [ "$SITE_BUCKET" = "None" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "StaticSiteStack is missing the bucket or CloudFront output." >&2
            exit 1
          fi

          echo "SITE_BUCKET=$SITE_BUCKET" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$DISTRIBUTION_ID" >> "$GITHUB_ENV"

      - name: Sync site to S3
        run: aws s3 sync dist/ "s3://$SITE_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
