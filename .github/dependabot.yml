# Dependabot version updates for both npm manifests in this repository:
# the Astro site at the root and the CDK app under cdk/.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "weekly"
